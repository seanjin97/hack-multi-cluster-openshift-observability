# Mock traffic for worker-1's /read, so the RED panels have data. Present at every demo step; no step rewrites it.
apiVersion: v1
kind: Service
metadata: {name: worker-1}
spec:
  selector: {app: worker-1}
  ports: [{port: 8080, targetPort: 8080}]   # by number: the port is named "http" at L0, "metrics" at L1
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata:
      labels: {app: loadgen}
      annotations:   # passes L1: nothing to expose or probe (doc/app-teams/0-levels.md)
        starlab-platform/metrics-exempt: "busybox load generator, no metrics to expose"
        starlab-platform/probes-exempt: "busybox load generator, serves nothing"
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://worker-1:8080/read; sleep 0.2; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
