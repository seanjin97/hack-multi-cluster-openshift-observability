# podinfo frontend -> backend, frontends spread over both nodes, plus a tiny load generator
apiVersion: v1
kind: Namespace
metadata:
  name: spoke-1-demo
  labels: {golden-path.level: L1}   # every pod must expose a "metrics" port
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: [./podinfo, --port=9898]
          ports: [{name: metrics, containerPort: 9898}]   # podinfo serves /metrics natively
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 9898}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: frontend}}}
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: [./podinfo, --port=9898, --backend-url=http://backend:9898/echo]
          ports: [{name: metrics, containerPort: 9898}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app: frontend}
  ports: [{port: 9898}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata:
      labels: {app: loadgen}
      annotations: {golden-path/metrics-exempt: "busybox load generator, no metrics to expose"}
    spec:
      containers:
        # A 10-minute traffic wave, so every golden signal has something to show:
        #   traffic    1 -> 5 req/s and back (the wave)
        #   latency    /delay/1 on 1 in 10 requests: a slow endpoint stands out in p95
        #   errors     /status/500 and /status/503 on about 3% of requests, more at the peak
        #   saturation the frontend's 50m CPU limit throttles at the peak
        # The frontend proxies /echo to the backend, so both workloads get traffic.
        - name: wget
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                phase=$(( $(date +%s) / 60 % 10 ))                                      # minute 0..9 of the wave
                rps=$(( phase < 5 ? phase + 1 : 10 - phase ))                           # 1,2,3,4,5,5,4,3,2,1
                for n in $(seq "$rps"); do
                  i=$((i + 1))
                  case $((i % 100)) in
                    7|57)  path=status/500 ;;                                           # 2%: server error
                    33)    path=status/503 ;;                                           # 1%: unavailable
                    *0)    path=delay/1 ;;                                              # 10%: slow endpoint
                    *)     path=echo ;;
                  esac
                  [ "$rps" -eq 5 ] && [ $((i % 20)) -eq 0 ] && path=status/500          # peak: +5% errors
                  wget -qO- -T3 --post-data=hi "http://frontend:9898/$path" >/dev/null 2>&1 &
                done
                wait
                sleep 1
              done
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
