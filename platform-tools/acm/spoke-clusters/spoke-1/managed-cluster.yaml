# Registers spoke-1 with the ACM hub (applied to the hub, not the spoke).
# ACM then creates namespace spoke-1 on the hub holding the import manifests
# (secret spoke-1-import) that spokes.sh applies on the spoke.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: spoke-1
  # vendor/cloud are what ACM detects for k3s. Not "auto-detect": re-applying that
  # on a re-run briefly hides the cluster from ACM Observability, which uninstalls
  # its addon. Not omitted either: apply would remove ACM's detected value.
  labels:
    spoke-cluster: "true"
    name: spoke-1
    vendor: Other
    cloud: Other
    cluster.open-cluster-management.io/clusterset: default
spec:
  hubAcceptsClient: true
