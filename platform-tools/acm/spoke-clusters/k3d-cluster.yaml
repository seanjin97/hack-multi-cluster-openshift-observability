# k3d config shared by every spoke. k3d fills in the ${...} values from
# environment variables that spokes.sh sets.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ${SPOKE}
servers: 1
agents: 1

# crc's api.crc.testing / *.apps-crc.testing resolve to the Mac's 127.0.0.1.
# Inside Docker the Mac is the host gateway (${HUB_IP}), so point the hub's names there.
hostAliases:
  - ip: ${HUB_IP}
    hostnames:
      - api.crc.testing                                                              # klusterlet -> hub API
      - observatorium-api-open-cluster-management-observability.apps-crc.testing     # metrics push
      - alertmanager-open-cluster-management-observability.apps-crc.testing          # alerts push
      - cluster-proxy-anp.apps-crc.testing                                           # hub -> spoke tunnel (console, oc via hub)

# ACM's agent images come from registry.redhat.io. ACM doesn't copy usable
# credentials to the spokes, so the nodes use crc's own pull secret.
registries:
  config: |
    ${REGISTRIES}

# Cloudflare WARP's CA (or /dev/null when not behind WARP). Anything in
# /etc/ssl/certs is trusted by the nodes' image pulls.
volumes:
  - volume: ${CA}:/etc/ssl/certs/cloudflare.pem
    nodeFilters: ["server:*", "agent:*"]

options:
  k3d:
    wait: true
    disableLoadbalancer: true   # 1 server, nothing to balance
  k3s:
    extraArgs:
      # not needed for the demo apps; saves memory
      - arg: --disable=traefik,servicelb,metrics-server
        nodeFilters: ["server:*"]
  kubeconfig:
    # oc shares ~/.kube/config and should keep pointing at the hub
    switchCurrentContext: false
