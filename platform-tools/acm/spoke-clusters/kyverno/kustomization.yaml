# Kyverno, admission controller only, to enforce the L1 metrics rule
# (doc/app-teams/1-metrics.md). Background, cleanup and reports controllers are
# scaled to 0 to save ~300MB per spoke; nothing here needs them.
# Apply server-side (the CRDs are too big for client-side apply):
#   oc --context k3d-spoke-N apply -k kyverno --server-side
resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.19.2/install.yaml
patches:
  - target: {kind: Deployment, name: kyverno-(background|cleanup|reports)-controller}
    patch: |
      - {op: replace, path: /spec/replicas, value: 0}
