# L1 namespaces: every pod must expose a container port named "metrics", which
# ACM's spoke Prometheus scrapes (metrics/pod-monitor.yaml). Pods with nothing
# to expose opt out with a golden-path/metrics-exempt: "<reason>" annotation.
# Applied after Kyverno's CRDs exist (spokes.sh).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-metrics-port
spec:
  validationActions: [Deny]
  evaluation:
    background: {enabled: false}   # reports controller is off
  autogen:
    podControllers: {controllers: []}   # check pods only; deployments still roll out, pods are rejected
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods]}
    namespaceSelector: {matchLabels: {golden-path.level: L1}}
  matchConditions:
    - name: not-exempt
      expression: "!has(object.metadata.annotations) || !('golden-path/metrics-exempt' in object.metadata.annotations)"
  validations:
    - expression: "object.spec.containers.exists(c, has(c.ports) && c.ports.exists(p, has(p.name) && p.name == 'metrics'))"
      message: >-
        golden-path L1: expose a container port named "metrics", or annotate the
        pod with golden-path/metrics-exempt: "<reason>". See doc/app-teams/1-metrics.md.
