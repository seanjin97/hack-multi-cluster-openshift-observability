# podinfo frontend -> backend, frontends spread over both nodes, plus a tiny load generator
apiVersion: v1
kind: Namespace
metadata: {name: demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: [./podinfo, --port=9898]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: demo}
spec:
  selector: {app: backend}
  ports: [{port: 9898}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: frontend}}}
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: [./podinfo, --port=9898, --backend-url=http://backend:9898/echo]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: demo}
spec:
  selector: {app: frontend}
  ports: [{port: 9898}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
        - name: wget
          image: busybox:1.36
          command: [sh, -c, 'while true; do wget -qO- -T2 --post-data=hi http://frontend:9898/echo >/dev/null; sleep 1; done']
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 20m, memory: 16Mi}}
