# Dependencies for the dashboard generators (ADR 0005). uv reads this; no venv to manage by hand.
#   uv run build.py          build dashboards
#   uv run pytest            component tests + golden-path conformance (tests/)
[project]
name = "starforge-dashboards"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "grafana-foundation-sdk==0.0.21",  # 0.0.x follows the SDK's main, for Grafana >= 12 (ACM ships 12.4)
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]  # components/, build.py and tests/helpers.py import by name
